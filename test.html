<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live HTML Viewer</title>
    <style>
        :root {
            --bg: #1e1e1e;
            --panel: #252526;
            --text: #d4d4d4;
            --accent: #007acc;
            --accent-hover: #0062a3;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Toolbar Styles */
        .toolbar {
            background-color: var(--panel);
            padding: 10px 20px;
            display: flex;
            gap: 10px;
            align-items: center;
            border-bottom: 1px solid #333;
        }

        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .secondary-btn {
            background-color: #3a3d41;
        }

        .secondary-btn:hover {
            background-color: #45494e;
        }

        /* Editor Area */
        #editor-container {
            flex-grow: 1;
            position: relative;
        }

        textarea {
            width: 100%;
            height: 100%;
            background: transparent;
            color: #9cdcfe;
            border: none;
            padding: 20px;
            box-sizing: border-box;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 14px;
            resize: none;
            outline: none;
        }

        .status {
            font-size: 12px;
            color: #888;
            margin-left: auto;
        }
    </style>
</head>
<body>

    <div class="toolbar">
        <button onclick="openPreview()">🚀 Open Preview Tab</button>
        <button class="secondary-btn" onclick="copyCode()">Copy</button>
        <button class="secondary-btn" onclick="pasteCode()">Paste</button>
        <button class="secondary-btn" onclick="selectAll()">Select All</button>
        <button class="secondary-btn" onclick="clearAll()">Clear</button>
        <span class="status" id="status-text">Auto-saving enabled</span>
    </div>

    <div id="editor-container">
        <textarea id="code-editor" placeholder="Type or paste your HTML here..." spellcheck="false"></textarea>
    </div>

    <script>
        const editor = document.getElementById('code-editor');
        const storageKey = 'live_html_code';

        // Load saved content on startup
        window.onload = () => {
            const saved = localStorage.getItem(storageKey);
            if (saved) editor.value = saved;
        };

        // Update localStorage whenever user types
        editor.addEventListener('input', () => {
            localStorage.setItem(storageKey, editor.value);
        });

        function openPreview() {
            // Generates a random number for the window ID as requested
            const sessionID = Math.floor(Math.random() * 9000) + 1000;
            const previewWindow = window.open('', `Preview_${sessionID}`);
            
            // Create the content for the new tab
            const blobContent = `
                <html>
                <head>
                    <title>Preview #${sessionID}</title>
                    <style>body { margin: 0; padding: 0; }</style>
                </head>
                <body>
                    <div id="preview-root"></div>
                    <script>
                        function updateContent() {
                            const code = localStorage.getItem('${storageKey}');
                            document.getElementById('preview-root').innerHTML = code || '<h1>No content to display</h1>';
                        }
                        
                        // Initial Load
                        updateContent();

                        // Listen for changes in localStorage from the main tab
                        window.addEventListener('storage', (e) => {
                            if (e.key === '${storageKey}') {
                                updateContent();
                            }
                        });
                    <\/script>
                </body>
                </html>
            `;

            previewWindow.document.open();
            previewWindow.document.write(blobContent);
            previewWindow.document.close();
        }

        // Toolbar Functions
        async function pasteCode() {
            try {
                const text = await navigator.clipboard.readText();
                editor.value += text;
                localStorage.setItem(storageKey, editor.value);
            } catch (err) {
                alert("Please grant clipboard permissions.");
            }
        }

        function copyCode() {
            editor.select();
            document.execCommand('copy');
        }

        function selectAll() {
            editor.select();
        }

        function clearAll() {
            if(confirm("Clear all code?")) {
                editor.value = "";
                localStorage.setItem(storageKey, "");
            }
        }
    </script>
</body>
</html>
